<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심야에는 나폴리탄이 필요해서,</title><style>
:root{color-scheme:dark;--bg:#0d0d12;--fg:#e8e6df;--ac:#ff8d84;--mu:#8a8a94;--bd:#2c2c36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#g{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;line-height:1.4}.mu{color:var(--mu);font-size:.9rem}
p,.t{white-space:pre-wrap}
button{display:block;width:100%;margin:6px 0;padding:12px;background:#17171f;color:var(--fg);border:1px solid var(--bd);border-radius:8px;font:inherit;cursor:pointer;text-align:left}
button:hover{border-color:var(--ac)}button.x{border-color:var(--ac);color:var(--ac)}
.bar{display:flex;justify-content:space-between;color:var(--mu);border-bottom:1px solid var(--bd);padding-bottom:8px}
.box{border:1px solid var(--bd);border-radius:8px;padding:14px;margin:14px 0;background:#13131a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row button{margin:0}
a{color:var(--ac)}
</style></head><body><div id="g"></div><script>
const $=document.getElementById('g'),DR=['에스프레소','아메리카노','스팀밀크','커피라떼'];
const MN=["메뉴에 없는 것을 요구하는 손님에게는 요구대로 주거나 셔터를 내리도록 한다.\n손님은 왕이지만, 폭군을 상대할 필요는 없다.","말없이 쳐다보는 손님 앞에서는 불을 끄지 말고, 뭔가 쥐어주도록.","같은 손님이 두 번 연속으로 오면 불을 끈다. 한밤중에 손님이 그저 ‘맛있어서’ 오지는 않을 것이다.","손님의 말이 같은 말로 반복되기 시작하면 불을 끈다. 세상에는 굳이 듣지 않아도 되는 말도 있는 법이다.","정상 손님에게 영업을 중단하면 클레임이 접수된다. 세 번 접수되면 해고된다. 일을 게을리 하지 말 것!!","어두운 밤이 지나치게 길어지면 원치 않는 손님이 찾아오는 경우가 있다. 이번이 그렇다."];
const T0=["“내가 물 달라고 한 거 아니잖아. 색이 달라, 색이 달라, 색이 달라...!!”\n그 사람은 어쩐지 핏발 선... 저게 눈일까?\n뭔가 이상한 것을 눈치채기도 전에 나는 시야가 붉게 물들었다.","(컵에 담긴 피가 잠시간 괴상한... 물감을 탄 것마냥 변했다가 원래대로 돌아갔다.)\n“고마워요, 잘 마시겠습니다.”\n속이 메슥거린다. 어지럽다... 누군가가 내 피를 마시면서 사라져간다...","“다 보이는데요...?”\n그 말과 동시에 시야가 깜깜해졌다. 그게 끝이었다.","“망할! 과제 어쩌지...”\n날카로운 소리와 함께 셔터를 긁는 소음이 잦아들더니 이윽고 들리지 않게 되었다.","“아니, 그럼 내가 직접 가져갈게요.”\n직접? 대체 피를 어디에서 구한다는...\n나는 어디서 구하면 되는지 알고 싶지 않았다. 하지만 이젠 안다."];
const T1=["(음료는 쥐어져 있었다. 그저 액체가 허공 어딘가로 사라질 뿐. 컵은 아무렇게나 던져졌고, 손님이 서있던 자리에는 아무것도 없었다.)","“......!!!!”\n뭔가 부딪히는 소리가 나더니 다음 순간에는 정적이 찾아왔다.","“......다음은 없다.”\n그 말을 끝으로 형체가 바닥으로 푹 꺼졌다. 대체 뭐였던 거지?","“줘.”\n뭘 달라고 한 걸까. 그걸 깨달았을 땐 이미...","“......!!!!”\n잘못 건드렸다. 저건 취한 사람이 아니라..."];
const TA=["“아하하, 그래가지고 계속”\n그 이후에 들은 건 뭐였뭐였뭐였뭐였뭐였뭐였...","“학생학ㄱㄱㄱ생학생학생학생”\n고장난 태엽인형 같은 소리와 함께 손이 불쑥 셔터 틈새로 튀어나왔다. 그게 다였다.","셔터 뒤의 그 여자는 같은 문구를 반복하고 있다가, 이윽고 걸어가는 소리가 멀어져갔다. 나는 그저 숨을 죽이고 그 여자가 사라지는 것을 기다릴 수밖에 없었다...","가로등 불빛에 비춰진 그 여자는 같은 문구를 반복하고 있다가, 지나가는 또 다른 행인을 향해갔다. 나는 그저 숨을 죽이고 그 여자가 사라지는 것을 기다릴 수밖에 없었다..."];
const TR="어쩐지 고장난 동영상을 잘못 스트리밍하는 것마냥, 앞에 서있는 손님에게서 위화감이 들기 시작했다.";
const CARRY="분명 라떼는 저 사람에게 주었다. 하지만 마치 누군가가 반복 재생을 걸기라도 한 것마냥, 아주머니의 동작이, 눈앞에서 그대로 되풀이되기 시작했다.";
const DARK="불을 끄자 이번에는 아무것도 보이지 않았다.\n문 열리는 소리가 났다. 나는 분명 잠그지 않았다."; // 임시
const CL=[["“아니 저기요 저 과제도 바쁜데 음료를 딴 거를 주시면 어떡해요...”\n황당하다는 듯이 이쪽을 쳐다보더니, 과제가 더 급하다는 듯이 잽싸게 사라졌다.","“마, 마감이에요??? 아, 아 제발!!! 근처에 문 연 카페 여기밖에 없는데!!! 내 아메리카노!!!”\n절규와 함께 멀어져가는 발소리가 들린다...","“저기요!! 저기요 가게 문 닫는 거면 빨리 좀 얘기하시지...\n편의점 가야겠다...”\n체념한 것 같다."],["","“에이 씨!! 장사 똑바로 하쇼!!”\n그는 화를 냈지만 별 수 없다는 듯 떠났다...","“마!!!! 사람이 앞에 있는데 불을 끄고 난리고!!!”\n그는 화를 냈지만 별 수 없다는 듯 떠났다..."],["“학생... 라떼가 뭔지 몰라?”\n어이없다는 눈길로 쳐다보더니, 궁시렁대며 앞에서 떠나갔다...","“아니 학생!!! 학생!!! 영업 시간은!! 나 민원 넣을 거야!!”\n뭐라 하는 소리가 들려왔지만 무시했다.","“아니 학생!!! 학생!!! 영업 시간은!! 나 민원 넣을 거야!!”\n뭐라 하는 소리가 들려왔지만 무시했다."]];
const LV=["“휴우... 이거 마시고 과제나 하러 가야지...”\n그는 지친 눈빛을 하고 터덜터덜 걸어갔다. 머리카락에 묻은 물감은 신경도 안 쓴 채.","냅다 음료를 꿀꺽꿀꺽 마시더니 크하~! 하는 소리와 함께, 빈 컵만 어울리지 않게 조심스러운 손동작으로 올려두고 사라져갔다...","“오호호, 고마워 학생~ 열심히 해~”\n아주머니는 급할 것 없다는 듯이 총총대며 사라졌다..."];
let U=[];try{U=JSON.parse(localStorage.getItem('cafeM')||'[]')}catch(e){}
function unlock(k){const n=!U.includes(k);if(n){U.push(k);try{localStorage.setItem('cafeM',JSON.stringify(U))}catch(e){}}return n}
let S;
const h=x=>{$.innerHTML=x},B=(l,f,c)=>`<button class="${c||''}" onclick="${f}">${l}</button>`;
const tm=()=>{const m=S.t*30;return String(m/60|0).padStart(2,'0')+':'+(m%60?'30':'00')};
const bar=()=>`<div class="bar"><span>${tm()}</span><span>클레임 ${S.cl}/3</span></div>`;
function title(){h(`<h1>심야에는 나폴리탄이 필요해서,</h1><p class="mu">장르 : 호러 손님 접대 시뮬레이션\n예상 플레이 시간 : 10~15분</p><p class="mu">내용 주의 : 바디 호러, 고어한 장면이 포함되어 있습니다.</p><p class="mu">텍스트 &amp; 기획: 미그 · <a href="mailto:patricia97@naver.com">patricia97@naver.com</a>\n번역: 기계 번역 및 AI 번역\n코딩: GPT &amp; Claude</p>${B('시작','intro()')}${B('카페 매뉴얼 ('+U.length+'/6)','man()')}`)}
function intro(){h(`<p>이상한 알바였다. 밤 12시부터 6시까지. 한적한 카페에서 혼자 알바를 하고 마감을 하면 된다는 것이다. 시급이 3배라니 조금 이상하다고 생각했지만, 아무래도 좋다. 돈이 필요하고, 카페 알바에는 자신 있다.\n\n그저... 내가 알던 것과는 조금 다른 알바라는 것을 알기 전까진.</p>${B('출근한다','go()')}`)}
function go(){S={t:0,cl:0,ls:0,fc:false,last:-1,c:null,msg:''};next()}
function nx(){S.t++;next()}
function next(){
 if(S.t>=12)return fin('clear');
 let c;
 if(S.fc){c={i:2,st:1,ph:2,via:'c',o:3,tk:0};S.fc=false;S.msg=CARRY}
 else{let i;do i=Math.random()*3|0;while(i==S.last||(S.ls>=2&&i==2));c={i,st:Math.random()<.3?1:0,ph:1,o:[1,-1,3][i],tk:0,said:[]};if(c.o>=0)c.said=[c.o];S.msg=''}
 S.last=c.i;S.c=c;view()}
function ln(c){const i=c.i,s=c.st;
 if(i==0)return s?'“과제가 빡세다... 피 1잔 주세요.”':`“과제가 빡세다... ${DR[c.o]} 1잔 주세요.”`;
 if(i==1)return s?'“……”':'“내가... 말이야, 어!!!! 누군지 알아 몰라??? 밥 줘!!”';
 return c.ph==2?'“아하하, 그래가지고 계속 잘랐다니까 잘랐다니까 잘랐다니까 학생 하나 줘요줘요줘요줘요줘요줘요”':`“(통화중)아하하, 그래가지고 계속 잘랐다니까 그러네? 거기 학생! ${DR[c.o]} 하나 줘요.”`}
function view(){const c=S.c,p2=c.i==2&&c.st&&c.ph==2;let b='';
 if(p2)b+=B('나',"act('sp')",'x');
 else{b+='<div class="row">'+DR.map((d,i)=>B(d,`act('d${i}')`)).join('')+'</div>';if(c.i==0&&c.st)b+=B('피 1잔',"act('sp')",'x')}
 b+=B('셔터 닫기',"act('sh')");
 if(!p2&&!c.tk)b+=B('“메뉴에서 골라주세요”',"act('menu')")+B('“해당 항목은 품절입니다”',"act('out')");
 b+=B('불 끄기',"act('li')");
 h(`${bar()}<div class="box t">${S.msg?S.msg+'\n\n':''}${ln(c)}</div>${b}`)}
function normal(c,a,d){const i=c.i,N=CL[i];
 if(d>=0)return(i==1||d==c.o)?{e:'leave',x:LV[i]}:{e:'claim',x:N[0].replace('라떼',DR[c.o])};
 if(a=='sh')return{e:'claim',x:N[1]};if(a=='li')return{e:'claim',x:N[2]};
 c.tk=1;if(i==1)return{x:'“마!!! 밥 도!!!”\n목소리가 좀 더 커졌다...'};
 const r=[0,1,2,3].filter(k=>!c.said.includes(k));c.o=r[Math.random()*r.length|0];c.said.push(c.o);const n=DR[c.o];return{x:i==0?`“저 과제 급해요... ${n}!!! ${n} 주세요 제발...”`:`“학생, ${n} 줘. 찐~하게 타서.”`}}
function strange(c,a,d,f){const i=c.i,D=(m,x)=>({e:'death',m,x}),L=x=>({e:'leave',x});
 if(i==0){if(d>=0)return D(0,T0[0]);if(a=='sp')return L(T0[1]);if(a=='sh')return f?D(0,T0[2]):L(T0[3]);if(a=='menu')return{x:'“나는 붉은 색 음료가 필요하다고요.”'};if(a=='out')return D(0,T0[4]);return D(0,T0[2])}
 if(i==1){if(d>=0)return L(T1[0]);if(a=='sh')return L(f?T1[2]:T1[1]);if(a=='li')return D(1,T1[4]);return D(1,T1[3])}
 const m=c.via=='c'?2:3;if(a=='sp')return D(m,TA[0]);if(a=='sh')return f?D(m,TA[1]):L(TA[2]);return L(TA[3])}
function res(c,a){const d=a[0]=='d'?+a[1]:-1,f=Math.random()<.2;
 if(c.i==2&&c.st&&c.ph==1){if(d==3)return{e:'stay',x:'(아주머니는 라떼를 받아 들고 통화를 이어 가며 서 있었다.)'};if(a=='menu'||a=='out'){c.ph=2;c.via='t';return{x:TR}}}
 return(c.st&&!(c.i==2&&c.ph==1))?strange(c,a,d,f):normal(c,a,d)}
function act(a){const c=S.c,r=res(c,a);
 if(!r.e){S.msg=r.x||'';return view()}
 S.ls=a=='li'?S.ls+1:0;if(S.ls>=3)return die(DARK,5);
 if(r.e=='death')return die(r.x,r.m);
 if(r.e=='claim'){S.cl++;return out(r.x+'\n\n(클레임 +1)',S.cl>=3?"fin('fired')":'nx()')}
 if(r.e=='stay')S.fc=true;
 out(r.x,'nx()')}
function out(x,f){h(`${bar()}<div class="box t">${x}</div>${B('다음',f)}`)}
function rule(m){const n=m!=null&&unlock(m);return`<p class="mu">${n?'새 규칙이 기록되었습니다':'이미 기록된 규칙입니다'}</p><div class="box t">${MN[m]}</div>`}
function die(x,m){h(`<h1 style="color:var(--ac)">사망</h1><div class="box t">${x}</div>${rule(m)}${B('다시 출근한다','go()')}${B('카페 매뉴얼','man()')}`)}
function fin(k){if(k=='clear')h(`<h1>06:00</h1><div class="box t">... 긴 아침이었다. 아니, 긴 밤이었다.\n거리에는 어젯밤의 일들이 아무것도 아닌 것처럼,\n출근하러 가는 인간들이 드문드문 돌아다니기 시작했다.\n한숨 자야 할 것 같다. 아니, 깨있는 게 좋을까.\n더 일해도 좋은 건지, 솔직히 확신이 없다...</div>${B('처음으로','title()')}${B('카페 매뉴얼','man()')}`);
 else h(`<h1 style="color:var(--ac)">해고</h1><div class="box t">그래, 카페 알바인데 하룻밤 만에 클레임이 3건이나 들어오면 누구나 잘리겠지.\n예상한 바였다. 그럼에도 불구하고 알바비는 들어왔다.\n이 알바, 계속 하면 어떻게 됐을까...\n아니, 어쩌면 차라리 잘린 게 나을지도.</div>${rule(4)}${B('다시 출근한다','go()')}${B('카페 매뉴얼','man()')}`)}
function man(){h(`<h1>카페 매뉴얼</h1>${MN.map((m,i)=>`<div class="box t">${U.includes(i)?m:'???'}</div>`).join('')}${B('돌아가기','title()')}`)}
title()
</script></body></html>
